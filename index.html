<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KO II">
<meta name="theme-color" content="#16130e">
<meta name="description" content="A phone-first, offline companion for learning the Teenage Engineering EP-133 K.O. II — device map, every combo, recipes, and fixes.">
<title>K.O. II — coach</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<main class="wrap">

  <!-- ===== MAP — the device, nothing else ===== -->
  <section id="map">
    <div class="device" role="group" aria-label="K.O. II — faithful control map">

      <!-- segment display replica — every indicator is tappable.
           Muted = idle, lit = as in use. Tap one for what it means. -->
      <div class="dscreen" id="dscreen">
        <button class="dicon dsgrp lit" data-icon="groups" aria-label="Group tags A to D">
          <b><i style="background:var(--gA)"></i>A</b><b><i style="background:var(--gB)"></i>B</b>
          <b><i style="background:var(--gC)"></i>C</b><b><i style="background:var(--gD)"></i>D</b>
        </button>

        <div class="dstop">
          <button class="dicon" data-icon="rec" aria-label="Record dot"><span class="dot-rec"></span></button>
          <button class="dicon" data-icon="play" aria-label="Play"><svg viewBox="0 0 12 12"><path d="M2.5 1.5l8 4.5-8 4.5z"/></svg></button>
          <button class="dicon" data-icon="note" aria-label="Note value"><svg viewBox="0 0 12 12"><circle cx="4" cy="9.4" r="2.1"/><path d="M6 9.4V1.6l3.6 1.5v2.2L6.6 3.9" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
          <button class="dicon" data-icon="q" aria-label="Quantize"><span class="tx">Q</span></button>
          <button class="dicon" data-icon="metro" aria-label="Metronome"><svg viewBox="0 0 12 12"><path d="M4 1.5h4l1.6 9H2.4z" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M6 8.5L8.6 3" stroke="currentColor" stroke-width="1.1"/></svg></button>
          <button class="dicon" data-icon="keysic" aria-label="Keys mode"><svg viewBox="0 0 14 12"><rect x="1" y="2" width="12" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M4.7 2v5M9.3 2v5" stroke="currentColor" stroke-width="1.1"/></svg></button>
          <button class="dicon" data-icon="punch" aria-label="Punch-in FX"><svg viewBox="0 0 13 12"><path d="M2 7.2c0-2.6 1.6-4.4 4.2-4.4 2.4 0 4.3 1.5 4.3 3.9 0 1.9-1.2 3.2-3 3.5H4.2C2.8 10 2 8.8 2 7.2z"/><rect x="1.2" y="8.6" width="4.6" height="2.2" rx="1"/></svg></button>
          <button class="dicon" data-icon="loop" aria-label="Loop"><svg viewBox="0 0 12 12"><path d="M6 2a4 4 0 110 8 4 4 0 01-3.4-1.9" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M2 10.4V7.6h2.8z"/></svg></button>
          <button class="dicon" data-icon="umb" aria-label="Undo umbrella"><svg viewBox="0 0 12 12"><path d="M1.2 6a4.8 4.8 0 019.6 0z"/><path d="M6 6v3.4a1.2 1.2 0 01-2.4 0" fill="none" stroke="currentColor" stroke-width="1.1"/></svg></button>
        </div>

        <div class="dsnum">
          <button class="dicon dsbar lit" data-icon="bar" aria-label="Bar indicator"><span class="barpill">BAR</span></button>
          <button class="dicon dsdigits lit" data-icon="digits" aria-label="Main number display"><span class="num" id="dev-num">S.01</span></button>
        </div>

        <div class="dsright">
          <div class="dsrow">
            <button class="dicon" data-icon="batt" aria-label="Battery"><svg viewBox="0 0 14 8"><rect x="0.8" y="1" width="11" height="6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.1"/><rect x="12.4" y="2.8" width="1.4" height="2.4" rx="0.5"/><rect x="2.4" y="2.5" width="2.4" height="3"/></svg></button>
            <button class="dicon" data-icon="usb" aria-label="USB"><span class="tx">USB</span></button>
            <button class="dicon" data-icon="midi" aria-label="MIDI"><span class="tx">MIDI</span></button>
          </div>
          <div class="dsrow">
            <button class="dicon" data-icon="mic" aria-label="Microphone input"><svg viewBox="0 0 10 12"><rect x="3.2" y="1" width="3.6" height="6" rx="1.8"/><path d="M1.8 5.8a3.2 3.2 0 006.4 0M5 9v2" fill="none" stroke="currentColor" stroke-width="1.1"/></svg></button>
            <button class="dicon" data-icon="line" aria-label="Line input"><span class="tx">LINE</span></button>
            <button class="dicon" data-icon="clip" aria-label="Clip warning"><span class="tx clipred">CLIP</span></button>
          </div>
          <button class="dicon dsmeter" data-icon="meter" aria-label="Level meter">
            <span class="mlab">LOW</span><span class="mbars"><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="mlab">MID</span>
          </button>
        </div>

        <button class="dicon dsmode lit" data-icon="mode" aria-label="Mode label"><span class="modepill">MAIN</span></button>
      </div>

      <!-- control surface: 7 cols × 5 rows, true positions.
           Tiny labels above the 12 pads = fader destinations, printed on the
           body exactly as on the unit. data-shift = the key's boxed shift
           function, opened with a long-press. -->
      <div class="surface">
        <!-- row 1 -->
        <button class="key knob vol" data-id="volume" style="grid-column:1;grid-row:1"><span class="dial"></span><span class="kl">vol</span></button>
        <button class="key k-blk" data-id="sound" data-shift="sfedit" style="grid-column:2;grid-row:1"><span class="lab">SOUND</span><span class="sub sb-wht">edit</span></button>
        <button class="key k-blk" data-id="main" data-shift="sfcommit" style="grid-column:3;grid-row:1"><span class="lab">MAIN</span><span class="sub sb-org">commit</span></button>
        <button class="key k-blk" data-id="tempo" data-shift="sfloop" style="grid-column:4;grid-row:1"><span class="lab">TEMPO</span><span class="sub sb-grey">loop</span></button>
        <div style="grid-column:5;grid-row:1"></div>
        <button class="key knob bpm" data-id="knobx" style="grid-column:6;grid-row:1"><span class="dial"></span><span class="kl">x</span></button>
        <button class="key knob met" data-id="knoby" style="grid-column:7;grid-row:1"><span class="dial"></span><span class="kl">y</span></button>

        <!-- row 2 -->
        <button class="key k-blk" data-id="keys" style="grid-column:1;grid-row:2"><span class="lab">KEYS</span></button>
        <button class="key k-grp" data-id="groupa" style="grid-column:2;grid-row:2"><span class="lab">A</span><span class="sym">✳</span><span class="stripe"></span></button>
        <button class="key k-pad" data-id="pad7" style="grid-column:3;grid-row:2"><span class="silk">level</span><span class="num">7</span></button>
        <button class="key k-pad" data-id="pad8" style="grid-column:4;grid-row:2"><span class="silk">pitch</span><span class="num">8</span></button>
        <button class="key k-pad" data-id="pad9" style="grid-column:5;grid-row:2"><span class="silk">time</span><span class="num">9</span></button>
        <button class="key k-orange" data-id="sample" data-shift="sfchop" style="grid-column:6;grid-row:2"><span class="lab">SAMPLE</span><span class="sub sb-wht">chop</span></button>
        <button class="key k-blk" data-id="timing" data-shift="sfcorrect" style="grid-column:7;grid-row:2"><span class="lab">TIMING</span><span class="sub sb-wht">correct</span></button>

        <!-- row 3 -->
        <button class="key k-blk" data-id="fader" style="grid-column:1;grid-row:3"><span class="lab">FADER</span></button>
        <button class="key k-grp" data-id="groupb" style="grid-column:2;grid-row:3"><span class="lab">B</span><span class="sym">↵</span><span class="stripe"></span></button>
        <button class="key k-pad" data-id="pad4" style="grid-column:3;grid-row:3"><span class="silk">lpf</span><span class="num">4</span></button>
        <button class="key k-pad" data-id="pad5" style="grid-column:4;grid-row:3"><span class="silk">hpf</span><span class="num">5</span></button>
        <button class="key k-pad" data-id="pad6" style="grid-column:5;grid-row:3"><span class="silk">fx</span><span class="num">6</span></button>
        <button class="key k-blk" data-id="fx" data-shift="sfoutput" style="grid-column:6;grid-row:3"><span class="lab">FX</span><span class="sub sb-wht">output</span></button>
        <button class="key k-wht" data-id="erase" data-shift="sfsystem" style="grid-column:7;grid-row:3"><span class="lab">ERASE</span><span class="sub sb-grey">system</span></button>

        <!-- row 4 -->
        <div class="key slider" data-noop style="grid-column:1;grid-row:4;background:none;border:none;box-shadow:none"><div class="track"><div class="cap"></div></div></div>
        <button class="key k-grp" data-id="groupc" style="grid-column:2;grid-row:4"><span class="lab">C</span><span class="sym">↑</span><span class="stripe"></span></button>
        <button class="key k-pad" data-id="pad1" style="grid-column:3;grid-row:4"><span class="silk">atk</span><span class="num">1</span></button>
        <button class="key k-pad" data-id="pad2" style="grid-column:4;grid-row:4"><span class="silk">rel</span><span class="num">2</span></button>
        <button class="key k-pad" data-id="pad3" style="grid-column:5;grid-row:4"><span class="silk">pan</span><span class="num">3</span></button>
        <button class="key k-wht" data-id="minus" style="grid-column:6;grid-row:4"><span class="lab" style="font-size:16px">–</span></button>
        <button class="key k-wht" data-id="plus" style="grid-column:7;grid-row:4"><span class="lab" style="font-size:16px">+</span></button>

        <!-- row 5 -->
        <button class="key k-blk" data-id="shift" style="grid-column:1;grid-row:5"><span class="lab">SHIFT</span></button>
        <button class="key k-grp" data-id="groupd" style="grid-column:2;grid-row:5"><span class="lab">D</span><span class="sym">↓</span><span class="stripe"></span></button>
        <button class="key k-pad" data-id="paddot" style="grid-column:3;grid-row:5"><span class="silk">tune</span><span class="num">·</span></button>
        <button class="key k-pad" data-id="pad0" style="grid-column:4;grid-row:5"><span class="silk">vel</span><span class="num">0</span></button>
        <button class="key k-pad" data-id="enter" style="grid-column:5;grid-row:5"><span class="silk">mod</span><span class="lab" style="font-size:9px">ENTER</span></button>
        <button class="key k-orange" data-id="record" style="grid-column:6;grid-row:5"><span class="lab" style="font-size:8.5px">RECORD</span></button>
        <button class="key k-grey" data-id="play" style="grid-column:7;grid-row:5"><span class="lab" style="font-size:10px">PLAY</span></button>
      </div>

      <!-- silkscreen hint, printed on the chassis like the unit's own labels -->
      <div class="chint">tap a key · hold a key for its shift box · tap the screen icons</div>
    </div>
  </section>

  <!-- ===== COMBOS ===== -->
  <section id="combos" hidden>
    <div class="eyebrow">every shortcut, searchable</div>
    <div class="searchbar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Search — try 'undo', 'sample', 'swing'…" autocomplete="off" autocapitalize="off">
    </div>
    <div class="chips" id="chips"></div>
    <div id="combo-list"></div>
    <p class="metaline" id="metaline-combos"></p>
  </section>

  <!-- ===== LEARN ===== -->
  <section id="learn" hidden>
    <div class="eyebrow">step by step</div>
    <p class="lede">Short walkthroughs for the moves that build a track. Tap one and follow along on the unit.</p>
    <div id="recipe-list"></div>
  </section>

  <!-- ===== STUCK ===== -->
  <section id="stuck" hidden>
    <div class="eyebrow">i did something and…</div>
    <p class="lede">The stuff that stops new owners cold, and the exact fix for each.</p>
    <div id="fix-list"></div>
  </section>
</main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Control detail">
  <div class="grab"></div><div id="sheet-body"></div>
</div>

<nav><div class="navin">
  <button class="tab on" data-go="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="tl">map</span></button>
  <button class="tab" data-go="combos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span class="tl">combos</span></button>
  <button class="tab" data-go="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h10M4 12h16M4 19h12"/><circle cx="19" cy="5" r="1.6" fill="currentColor" stroke="none"/></svg><span class="tl">learn</span></button>
  <button class="tab" data-go="stuck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.6 2.6 0 015 .8c0 1.7-2.5 2-2.5 4"/><circle cx="12" cy="17.5" r="1" fill="currentColor" stroke="none"/></svg><span class="tl">stuck</span></button>
</div></nav>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
