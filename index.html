<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KO II">
<meta name="theme-color" content="#16130e">
<meta name="description" content="A phone-first, offline companion for learning the Teenage Engineering EP-133 K.O. II — device map, every combo, recipes, and fixes.">
<title>K.O. II — coach</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<main class="wrap">

  <!-- ===== MAP — the device, traced from the owner's unit ===== -->
  <section id="map">
    <div class="device" role="group" aria-label="K.O. II — faithful control map">

      <!-- top edge port tabs -->
      <div class="ports">
        <span class="port p-wht">OUTPUT</span><span class="port p-red">INPUT</span>
        <span class="port p-blk">SYNC&nbsp;&nbsp;MIDI</span><span class="port p-grey">USB</span><span class="port p-plain">POWER</span>
      </div>

      <!-- brand panel + speaker grille -->
      <div class="dhead">
        <div class="brand"><span class="bko">K.O. II</span><span class="bjp">サンプラー</span><span class="b128">128 MB SAMPLER COMPOSER</span></div>
        <div class="grille" aria-hidden="true"></div>
      </div>

      <!-- segment display replica — every indicator traced from the real
           unit's boot screen. Muted = unlit segment; tap any icon for what
           it means; it lights and stays lit. -->
      <div class="dscreen" id="dscreen">
        <div class="drow">
          <button class="dicon" data-icon="tape" aria-label="Tape illustration"><svg viewBox="0 0 18 10"><rect x="1" y="1" width="16" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.1"/><circle cx="6" cy="5" r="1.6"/><circle cx="12" cy="5" r="1.6"/></svg></button>
          <button class="dicon pxg lit" data-icon="padgrid" aria-label="Group A pad grid"></button>
          <button class="dicon lit" data-icon="groups" aria-label="Group A tag"><span class="lbox" style="background:var(--gA)">A</span></button>
          <button class="dicon" data-icon="sync" aria-label="Sync"><span class="tx">SYNC</span></button>
          <button class="dicon" data-icon="midi" aria-label="MIDI"><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="none" stroke="currentColor" stroke-width="1.1"/><circle cx="3.6" cy="5" r=".9"/><circle cx="6" cy="3.6" r=".9"/><circle cx="8.4" cy="5" r=".9"/><circle cx="4.4" cy="7.6" r=".9"/><circle cx="7.6" cy="7.6" r=".9"/></svg></button>
          <button class="dicon" data-icon="batt" aria-label="Power battery"><svg viewBox="0 0 8 13"><rect x="1" y="2.5" width="6" height="9.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.1"/><rect x="2.8" y="0.8" width="2.4" height="1.6" rx="0.4"/><rect x="2.4" y="8" width="3.2" height="2.6"/></svg></button>
          <button class="dicon lit" data-icon="bar" aria-label="Bar"><span class="pill p-red">BAR</span></button>
          <button class="dicon dsdigits lit" data-icon="digits" aria-label="Main number"><span class="num" id="dev-num">1.1.1</span></button>
          <button class="dicon" data-icon="bpm" aria-label="BPM"><span class="pill p-out">BPM</span></button>
          <button class="dicon" data-icon="meter" aria-label="Level meter"><span class="mbars"><i></i><i></i><i></i><i></i><i></i><i></i></span></button>
          <button class="dicon" data-icon="watch" aria-label="Stopwatch"><svg viewBox="0 0 12 13"><circle cx="6" cy="7.5" r="4.6" fill="none" stroke="currentColor" stroke-width="1.1"/><rect x="4.6" y="0.6" width="2.8" height="1.6" rx="0.4"/><path d="M6 7.5l2-2" stroke="currentColor" stroke-width="1.1"/></svg></button>
          <button class="dicon" data-icon="stereo" aria-label="Stereo"><svg viewBox="0 0 15 9"><circle cx="5.4" cy="4.5" r="3.6" fill="none" stroke="currentColor" stroke-width="1"/><circle cx="9.6" cy="4.5" r="3.6" fill="none" stroke="currentColor" stroke-width="1"/></svg></button>
          <button class="dicon dgauge lit" data-icon="gauge" aria-label="Color wheel">
            <svg viewBox="0 0 22 22"><path d="M11 11L11 1A10 10 0 0121 11Z" fill="#ff5a1f"/><path d="M11 11L21 11A10 10 0 0111 21Z" fill="#d1348a"/><path d="M11 11L11 21A10 10 0 011 11Z" fill="#2f74e8"/><path d="M11 11L1 11A10 10 0 0111 1Z" fill="#e8e2d0"/></svg>
          </button>
          <button class="dicon pxg" data-icon="rgrid" aria-label="Dot matrix"></button>
          <button class="dicon" data-icon="art" aria-label="Pixel art corner"><svg viewBox="0 0 14 14"><rect x="1" y="1" width="5" height="5" fill="#b14fd8"/><rect x="8" y="1" width="5" height="5" fill="#ff5a1f"/><rect x="1" y="8" width="5" height="5" fill="#ff5a1f"/><rect x="8" y="8" width="5" height="5" fill="#b14fd8"/></svg></button>
        </div>

        <div class="drow">
          <button class="dicon" data-icon="mute" aria-label="Mute"><span class="bub">MUTE</span></button>
          <button class="dicon pxg lit" data-icon="padgrid" aria-label="Group B pad grid"></button>
          <button class="dicon" data-icon="groups" aria-label="Group B tag"><span class="lbox" style="background:var(--gB)">B</span></button>
          <button class="dicon" data-icon="copy" aria-label="Copy"><span class="tx">⇊COPY</span></button>
          <button class="dicon" data-icon="paste" aria-label="Paste"><span class="tx">⇊PASTE</span></button>
          <button class="dicon" data-icon="save" aria-label="Floppy disk"><svg viewBox="0 0 12 12"><path d="M1.5 1.5h7.5l1.5 1.5v7.5h-9z" fill="none" stroke="currentColor" stroke-width="1.1"/><rect x="3.4" y="1.6" width="4" height="2.6"/><rect x="3" y="6.6" width="6" height="3.6" fill="none" stroke="currentColor" stroke-width="1"/></svg></button>
          <button class="dicon lit" data-icon="tic" aria-label="Tic"><span class="pill p-outred">TIC</span></button>
          <span class="dspace" aria-hidden="true"></span>
          <button class="dicon" data-icon="metro" aria-label="Metronome"><svg viewBox="0 0 12 12"><path d="M4 1.5h4l1.6 9H2.4z" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M6 8.5L8.6 3" stroke="currentColor" stroke-width="1.1"/></svg></button>
          <button class="dicon" data-icon="chopic" aria-label="Scissors chop"><svg viewBox="0 0 12 12"><circle cx="3" cy="9.4" r="1.6" fill="none" stroke="currentColor" stroke-width="1"/><circle cx="9" cy="9.4" r="1.6" fill="none" stroke="currentColor" stroke-width="1"/><path d="M4.2 8.2L9.5 1.5M7.8 8.2L2.5 1.5" stroke="currentColor" stroke-width="1.1"/></svg></button>
          <button class="dicon" data-icon="umb" aria-label="Undo umbrella"><svg viewBox="0 0 12 12"><path d="M1.2 6a4.8 4.8 0 019.6 0z"/><path d="M6 6v3.4a1.2 1.2 0 01-2.4 0" fill="none" stroke="currentColor" stroke-width="1.1"/></svg></button>
          <button class="dicon" data-icon="mono" aria-label="Mono"><span class="tx">MONO</span></button>
          <span class="dspace gsp" aria-hidden="true"></span>
          <button class="dicon pxg" data-icon="rgrid" aria-label="Dot matrix"></button>
        </div>

        <div class="drow">
          <button class="dicon" data-icon="keysic" aria-label="Keys mode"><svg viewBox="0 0 16 10"><rect x="1" y="1" width="14" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1"/><path d="M4.5 1v5M8 1v5M11.5 1v5" stroke="currentColor" stroke-width="1.4"/></svg></button>
          <button class="dicon pxg lit" data-icon="padgrid" aria-label="Group C pad grid"></button>
          <button class="dicon" data-icon="groups" aria-label="Group C tag"><span class="lbox" style="background:var(--gC)">C</span></button>
          <button class="dicon" data-icon="note" aria-label="Note value"><svg viewBox="0 0 10 12"><circle cx="3.4" cy="9.4" r="2.1"/><path d="M5.4 9.4V1.6l3.2 1.4v2.2L5.9 3.9" fill="none" stroke="currentColor" stroke-width="1.1"/></svg></button>
          <button class="dicon" data-icon="trim" aria-label="Trim"><svg viewBox="0 0 14 10"><path d="M2.5 1v8M11.5 1v8" stroke="currentColor" stroke-width="1.1"/><path d="M3.5 5c1.5-3 2.5 3 4 0s2.5 3 3 0" fill="none" stroke="currentColor" stroke-width="1"/></svg></button>
          <button class="dicon" data-icon="env" aria-label="Envelope"><svg viewBox="0 0 12 10"><path d="M1 9L4 1.5 7 6l4 3" fill="none" stroke="currentColor" stroke-width="1.1"/></svg></button>
          <button class="dicon" data-icon="stretch" aria-label="Time stretch"><svg viewBox="0 0 14 10"><path d="M1 5h12M3 2.5L1 5l2 2.5M11 2.5L13 5l-2 2.5" fill="none" stroke="currentColor" stroke-width="1.1"/></svg></button>
          <button class="dicon" data-icon="rec" aria-label="Record dot"><span class="dot-rec"></span></button>
          <button class="dicon" data-icon="play" aria-label="Play"><svg viewBox="0 0 12 12"><path d="M2.5 1.5l8 4.5-8 4.5z"/></svg></button>
          <button class="dicon" data-icon="loopic" aria-label="Loop arrow"><svg viewBox="0 0 12 12"><path d="M6 2a4 4 0 110 8 4 4 0 01-3.4-1.9" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M2 10.4V7.6h2.8z"/></svg></button>
          <button class="dicon" data-icon="arrow" aria-label="Big arrow"><svg viewBox="0 0 12 12"><path d="M10.5 10.5L4 9l2.2-2.2L1.5 2.1 3.6 1l4.6 4.6L10.5 4z"/></svg></button>
          <button class="dicon" data-icon="fx" aria-label="FX"><span class="tx txbig">FX</span></button>
          <button class="dicon" data-icon="tube" aria-label="Tube"><svg viewBox="0 0 8 12"><path d="M1 1h6v7a3 3 0 01-6 0z" fill="none" stroke="currentColor" stroke-width="1"/><path d="M2.5 11h3M4 8.5v2.5" stroke="currentColor" stroke-width="1"/></svg></button>
          <button class="dicon" data-icon="faderic" aria-label="Fader icon"><svg viewBox="0 0 12 10"><path d="M1 5h10" stroke="currentColor" stroke-width="1.1"/><rect x="4.5" y="2" width="3" height="6" rx="1"/></svg></button>
          <button class="dicon pxg" data-icon="rgrid" aria-label="Dot matrix"></button>
          <button class="dicon" data-icon="q" aria-label="Quantize"><span class="tx txbig">Q</span></button>
          <button class="dicon" data-icon="free" aria-label="Free time"><svg viewBox="0 0 14 6"><path d="M1 3c2-3 4 3 6 0s4 3 6 0" fill="none" stroke="currentColor" stroke-width="1.1"/></svg><span class="tx">FREE</span></button>
        </div>

        <div class="drow">
          <button class="dicon" data-icon="whistle" aria-label="Whistle illustration"><svg viewBox="0 0 13 10"><circle cx="4" cy="6" r="3" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M6.8 4.5L12 2.5v2L7.4 6.6" fill="none" stroke="currentColor" stroke-width="1.1"/><circle cx="4" cy="6" r="1"/></svg></button>
          <button class="dicon pxg lit" data-icon="padgrid" aria-label="Group D pad grid"></button>
          <button class="dicon" data-icon="groups" aria-label="Group D tag"><span class="lbox" style="background:var(--gD)">D</span></button>
          <button class="dicon" data-icon="soundic" aria-label="Sound mode"><span class="pill p-grey">SOUND</span></button>
          <button class="dicon" data-icon="phones" aria-label="Headphones"><svg viewBox="0 0 12 10"><path d="M1.5 8V6a4.5 4.5 0 019 0v2" fill="none" stroke="currentColor" stroke-width="1.1"/><rect x="1" y="6.4" width="2.4" height="3" rx="0.8"/><rect x="8.6" y="6.4" width="2.4" height="3" rx="0.8"/></svg></button>
          <button class="dicon lit" data-icon="mainic" aria-label="Main mode"><span class="pill p-org">MAIN</span></button>
          <button class="dicon" data-icon="burst" aria-label="Burst asterisk"><svg viewBox="0 0 12 12"><path d="M6 0.8v10.4M0.8 6h10.4M2.3 2.3l7.4 7.4M9.7 2.3l-7.4 7.4" stroke="currentColor" stroke-width="1.1"/></svg></button>
          <button class="dicon" data-icon="tempoic" aria-label="Tempo mode"><span class="pill p-blue">TEMPO</span></button>
          <button class="dicon" data-icon="eraseic" aria-label="Erase"><span class="pill p-redf">ERASE</span></button>
          <button class="dicon" data-icon="systemic" aria-label="System"><span class="pill p-mag">SYSTEM</span></button>
          <button class="dicon" data-icon="clip" aria-label="Clip warning"><svg viewBox="0 0 13 11"><path d="M6.5 1L12 10H1z" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M6.5 4v3M6.5 8.3v.9" stroke="currentColor" stroke-width="1.1"/></svg><span class="tx clipred">CLIP</span></button>
          <button class="dicon pxg" data-icon="rgrid" aria-label="Dot matrix"></button>
          <button class="dicon" data-icon="swing" aria-label="Swing"><span class="tx swred">SWING</span></button>
        </div>
      </div>

      <!-- control surface: 7 cols × 5 rows, true positions. The seven
           two-cap keys carry their shift function on the lower cap —
           tap the lower cap (or long-press the key) for that function. -->
      <div class="surface">
        <!-- row 1 -->
        <button class="key knob vol" data-id="volume" style="grid-column:1;grid-row:1"><span class="silk">volume</span><span class="dial"></span></button>
        <button class="key k2" data-id="sound" data-shift="sfedit" style="grid-column:2;grid-row:1"><span class="h top h-blk">SOUND</span><span class="h bot h-wht">EDIT</span></button>
        <button class="key k2" data-id="main" data-shift="sfcommit" style="grid-column:3;grid-row:1"><span class="h top h-blk">MAIN</span><span class="h bot h-red">COMMIT</span></button>
        <button class="key k2" data-id="tempo" data-shift="sfloop" style="grid-column:4;grid-row:1"><span class="h top h-blk">TEMPO</span><span class="h bot h-grey">LOOP</span></button>
        <div style="grid-column:5;grid-row:1"></div>
        <button class="key knob bpm" data-id="knobx" style="grid-column:6;grid-row:1"><span class="silk">bpm</span><span class="dial"></span><span class="ktag">X</span></button>
        <button class="key knob met" data-id="knoby" style="grid-column:7;grid-row:1"><span class="silk">metronome</span><span class="dial"></span><span class="ktag">Y</span></button>

        <!-- row 2 -->
        <button class="key k-blk" data-id="keys" style="grid-column:1;grid-row:2"><span class="lab">KEYS</span></button>
        <button class="key k-grp" data-id="groupa" style="grid-column:2;grid-row:2"><span class="gled on"></span><span class="lab">A</span><span class="sym">✳</span><span class="stripe"></span></button>
        <button class="key k-pad" data-id="pad7" style="grid-column:3;grid-row:2"><span class="silk">level</span><span class="num">7</span></button>
        <button class="key k-pad" data-id="pad8" style="grid-column:4;grid-row:2"><span class="silk">pitch</span><span class="num">8</span></button>
        <button class="key k-pad" data-id="pad9" style="grid-column:5;grid-row:2"><span class="silk">time</span><span class="num">9</span></button>
        <button class="key k2" data-id="sample" data-shift="sfchop" style="grid-column:6;grid-row:2"><span class="h top h-red">SAMPLE</span><span class="h bot h-wht">CHOP</span></button>
        <button class="key k2" data-id="timing" data-shift="sfcorrect" style="grid-column:7;grid-row:2"><span class="h top h-blk">TIMING</span><span class="h bot h-wht">CORRECT</span></button>

        <!-- row 3 -->
        <button class="key k-blk" data-id="fader" style="grid-column:1;grid-row:3"><span class="lab">FADER</span></button>
        <button class="key k-grp" data-id="groupb" style="grid-column:2;grid-row:3"><span class="gled"></span><span class="lab">B</span><span class="sym">↩</span><span class="stripe"></span></button>
        <button class="key k-pad" data-id="pad4" style="grid-column:3;grid-row:3"><span class="silk">lpf</span><span class="num">4</span></button>
        <button class="key k-pad" data-id="pad5" style="grid-column:4;grid-row:3"><span class="silk">hpf</span><span class="num">5</span></button>
        <button class="key k-pad" data-id="pad6" style="grid-column:5;grid-row:3"><span class="silk">→fx</span><span class="num">6</span></button>
        <button class="key k2" data-id="fx" data-shift="sfoutput" style="grid-column:6;grid-row:3"><span class="h top h-blk">FX</span><span class="h bot h-wht">OUTPUT</span></button>
        <button class="key k2" data-id="erase" data-shift="sfsystem" style="grid-column:7;grid-row:3"><span class="h top h-wht">ERASE</span><span class="h bot h-wht">SYSTEM</span></button>

        <!-- row 4 -->
        <div class="key slider" data-noop style="grid-column:1;grid-row:4;background:none;border:none;box-shadow:none"><div class="track"><div class="cap"></div></div></div>
        <button class="key k-grp" data-id="groupc" style="grid-column:2;grid-row:4"><span class="gled"></span><span class="lab">C</span><span class="sym">↑</span><span class="stripe"></span></button>
        <button class="key k-pad" data-id="pad1" style="grid-column:3;grid-row:4"><span class="silk">atk</span><span class="num">1</span></button>
        <button class="key k-pad" data-id="pad2" style="grid-column:4;grid-row:4"><span class="silk">rel</span><span class="num">2</span></button>
        <button class="key k-pad" data-id="pad3" style="grid-column:5;grid-row:4"><span class="silk">pan</span><span class="num">3</span></button>
        <button class="key k-wht" data-id="minus" style="grid-column:6;grid-row:4"><span class="lab" style="font-size:16px">–</span></button>
        <button class="key k-wht" data-id="plus" style="grid-column:7;grid-row:4"><span class="lab" style="font-size:16px">+</span></button>

        <!-- row 5 -->
        <button class="key k-wht" data-id="shift" style="grid-column:1;grid-row:5"><span class="lab">SHIFT</span></button>
        <button class="key k-grp" data-id="groupd" style="grid-column:2;grid-row:5"><span class="gled"></span><span class="lab">D</span><span class="sym">↓</span><span class="stripe"></span></button>
        <button class="key k-pad" data-id="paddot" style="grid-column:3;grid-row:5"><span class="silk">tune</span><span class="num">·</span></button>
        <button class="key k-pad" data-id="pad0" style="grid-column:4;grid-row:5"><span class="silk">vel</span><span class="num">0</span></button>
        <button class="key k-pad" data-id="enter" style="grid-column:5;grid-row:5"><span class="silk">mod</span><span class="lab" style="font-size:9px">ENTER</span></button>
        <button class="key k-red" data-id="record" style="grid-column:6;grid-row:5"><span class="lab" style="font-size:8.5px">RECORD</span></button>
        <button class="key k-grey" data-id="play" style="grid-column:7;grid-row:5"><span class="lab" style="font-size:10px">PLAY</span></button>
      </div>

      <!-- silkscreen hint, printed on the chassis like the unit's own labels -->
      <div class="chint">tap a key · lower cap or hold = shift function · tap the screen icons</div>
    </div>
  </section>

  <!-- ===== COMBOS ===== -->
  <section id="combos" hidden>
    <div class="eyebrow">every shortcut, searchable</div>
    <div class="searchbar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Search — try 'undo', 'sample', 'swing'…" autocomplete="off" autocapitalize="off">
    </div>
    <div class="chips" id="chips"></div>
    <div id="combo-list"></div>
    <p class="metaline" id="metaline-combos"></p>
  </section>

  <!-- ===== LEARN ===== -->
  <section id="learn" hidden>
    <div class="eyebrow">32 guided lessons</div>
    <div class="searchbar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="lq" type="search" placeholder="Search lessons — try 'swing', 'chop', 'sidechain'…" autocomplete="off" autocapitalize="off">
    </div>
    <div class="chips" id="lchips"></div>
    <div id="recipe-list"></div>
  </section>

  <!-- ===== STUCK ===== -->
  <section id="stuck" hidden>
    <div class="eyebrow">questions · issues · fixes</div>
    <div class="searchbar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="fq" type="search" placeholder="Search — try 'undo', 'muddy', 'save'…" autocomplete="off" autocapitalize="off">
    </div>
    <div class="chips" id="fchips"></div>
    <div id="fix-list"></div>
  </section>
</main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Control detail">
  <div class="grab"></div><div id="sheet-body"></div>
</div>

<nav><div class="navin">
  <button class="tab on" data-go="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="tl">map</span></button>
