# Mirrors main to the gh-pages branch on every push. GitHub Pages serves
# from gh-pages (auto-enabled when the branch first appeared), so this is
# the whole deploy — no repo settings, no artifact plumbing.
name: deploy to github pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: mirror main to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push --force origin HEAD:gh-pages
